name: kimaya_diario
description: Kimaya - Diario del Bosque del Eco (app companion del videojuego).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.9.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/video/inicio_app.mp4
    - assets/images/
