name: kimaya_diario
description: Kimaya - Diario del Bosque del Eco (app companion del videojuego).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.9.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/video/inicio_app.mp4
    - assets/images/menu_aventura.png
    - assets/images/pantalla_bosque.png
    - assets/images/bosque_nocturno_chispas.png
    - assets/images/icono_hermanas.png
    - assets/images/icono_circulo_hongos.png
    - assets/images/arbol_ancestral.png
    - assets/images/maya_retrato_sin_fondo.png
    - assets/images/encabezado_diario_del_bosque.png
    - assets/images/runa_raices.png
    - assets/images/runa_bruma.png
